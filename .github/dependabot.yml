version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # One minor/patch PR per run: the main ruleset requires an up-to-date branch,
    # so a second auto-merge PR would sit "behind" after the first one lands.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    groups:
      # init and analyze have to move together. Split across two pull requests,
      # each one leaves the workflow mixing codeql-action versions, which the
      # action rejects: "Not all workflow steps that use `github/codeql-action`
      # actions use the same version." Both then sit there failing forever.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: weekly
      # Not Monday: keeps it from landing beside the npm PR and going behind.
      day: thursday
      time: "06:15"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
