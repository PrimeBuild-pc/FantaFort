# Approves and queues auto-merge for Dependabot minor/patch updates. The "Protect main"
# ruleset still gates the merge on verify, analyze and the Vercel production build;
# majors stay manual. Requires "Allow GitHub Actions to approve pull requests".
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    # Both checks: a human push onto a Dependabot branch must never be auto-approved.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Approve and enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
