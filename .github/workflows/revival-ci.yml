name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect --source=/repo --log-opts=HEAD --redact --exit-code=1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run check:client-secrets
      - run: npm run check:headers
      - run: npm run check:api
      - run: npm run check:api-bounds
      - run: npm run check:auth
      - run: npm run check:admin
      - name: Start isolated Supabase
        run: npx --yes supabase@2.113.0 start
      - name: Check database security
        shell: bash
        run: |
          eval "$(npx --yes supabase@2.113.0 status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run check:db
          npm run check:community
          npx --yes supabase@2.113.0 db lint --local --level warning
