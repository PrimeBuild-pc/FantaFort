# Completes verified self-service account deletion requests. The web runtime has no
# server key, so this is the only path that finishes them; requests wait a 7-day grace
# window (an admin can still reactivate a mistaken request) and are done within ~8 days.
name: Process privacy deletions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List due requests without anonymizing
        type: boolean
        default: true
  schedule:
    - cron: "10 4 * * *"

permissions:
  contents: read

concurrency:
  group: process-privacy-deletions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configuration
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: npm
      - run: npm ci
      - name: Complete due deletion requests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run privacy:deletions -- --dry-run
          else
            npm run privacy:deletions
          fi

  # A failed run means a deletion is stuck; it must not fail silently.
  report-failure:
    needs: process
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scheduled workflow failing: ${{ github.workflow }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "First failing run: $RUN_URL"
          fi
